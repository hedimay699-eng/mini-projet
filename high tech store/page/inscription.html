<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - HighTechStore</title>
  <link rel="stylesheet" href="../style/style.css">
</head>
<body>
   <header> <div class="c1"><span>HTC</span> 
        <h1>High TechStore</h1></div> <div>
        <a href="../index.html" target="if">acuueil</a> <a href="page/pc.html" target="">pc</a> <a href="inscription.html" target="if">inscription</a> <a href="infos.html" target="if">infos</a>
</div>
    </header>
<div class="cont1">


  <main>
    <h2>Formulaire d'Inscription</h2>
    <hr>

    <form method="post">

      <table style="border: 0;" class="tatf">

        <tr style="border: 0;">
          <td style="border: 0;">
            <label>Nom :</label><br>
            <input type="text" id="nom" name="nom">
          </td>
          <td style="border: 0;">
            <label>Prenom :</label><br>
            <input type="text" id="prenom" name="prenom" >
          </td>
          <td style="border: 0;">
            <label for="">Date de naissance :</label><br>
            <input type="date" id="naissance" name="naissance">
          </td>
        </tr>

        <tr style="border: 0;">
          <td style="border: 0;">
            Sexe <br>
            <input type="radio" id="masculin" name="sexe" value="M" checked>
            <label >Masculin</label>
            <input type="radio" id="feminin" name="sexe" value="F">
            <label>Feminin</label>
          </td>
          <td style="border: 0;">
            <label for="">Adresse :</label><br>
            <input type="text" id="adresse" name="adresse">
          </td>
          <td style="border: 0;">
            <label>Code postal :</label><br>
            <input type="text" id="cp" name="cp">
          </td>
        </tr>

        <tr>
          <td style="border: 0;">
            <label>Ville :</label><br>
            <input type="text" id="ville" name="ville">
          </td>
          <td style="border: 0;">
            <label >Gouvernorat </label><br>
            <select id="gouvernorat" name="gouvernorat" >
              <option value="">-- Choisir un gouvernorat --</option>
            </select>
          </td>
          <td style="border: 0;">
            <label for="">Fonction :</label><br>
            <input type="text" id="fonction" name="fonction">
          </td>
        </tr>

        
        <tr style="border: 0;">
          <td style="border: 0;">
            <label for="">Adresse E-mail :</label><br>
            <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
          </td>
          <td style="border: 0;">
            <label for="">Numero de telephone :</label><br>
            <input type="tel" id="tel" name="tel">
          </td>
          <td></td>
        </tr>
        <tr style="border: 0;">
          <td style="border: 0;">
            <label>remarque</label><br>
            <textarea id="remarques" name="remarques" placeholder="Vos remarques ou precisions..."></textarea>
          </td>
        </tr>

        <tr style="border: 0;">
          <td style="border: 0;">
            <button type="submit">Valider l'inscription</button>
          </td>
        </tr>

      </table>

    </form>
  </main>
   <footer>2026 High TechStore - tous les droits reserve| hedi may</footer>
   </div>

  <hr>

</body>
</html>
